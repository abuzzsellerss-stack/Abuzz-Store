<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Orange Metallic Glow Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9d00" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Silver Tool Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Outer Glow Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Industrial Rounded Hexagon Container -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)" stroke="url(#orangeGrad)" stroke-width="18" filter="url(#glow)" />
  
  <!-- Outer Gear Ring Accents -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#f97316" stroke-width="6" stroke-dasharray="14 18" opacity="0.4" />

  <!-- CROSSED TOOLS ARTWORK -->
  <g transform="translate(256, 256)">
    
    <!-- WRENCH (Angled Left to Right) -->
    <g transform="rotate(-45)">
      <!-- Handle -->
      <rect x="-22" y="-140" width="44" height="280" rx="16" fill="url(#orangeGrad)" />
      <!-- Inner Grip Hole -->
      <rect x="-10" y="80" width="20" height="40" rx="8" fill="#0f172a" />
      <!-- Open End Wrench Head Top -->
      <path d="M-60,-130 C-60,-190 60,-190 60,-130 C60,-90 35,-80 35,-80 L-35,-80 C-35,-80 -60,-90 -60,-130 Z" fill="url(#silverGrad)" />
      <!-- Cutout Mouth of Wrench -->
      <path d="M-22,-195 L22,-195 L28,-125 L-28,-125 Z" fill="#0f172a" />
    </g>

    <!-- HAMMER (Angled Right to Left) -->
    <g transform="rotate(45)">
      <!-- Handle -->
      <rect x="-20" y="-130" width="40" height="270" rx="14" fill="url(#silverGrad)" />
      <!-- Rubber Grip -->
      <rect x="-22" y="50" width="44" height="75" rx="8" fill="#f97316" />
      <!-- Claw Hammer Head Top -->
      <path d="M-85,-130 L65,-130 L65,-80 L-50,-80 C-70,-80 -80,-95 -85,-130 Z" fill="url(#silverGrad)" />
      <!-- Hammer Strike Face Face Right -->
      <rect x="65" y="-138" width="25" height="66" rx="6" fill="url(#orangeGrad)" />
      <!-- Claw Curved Tail Left -->
      <path d="M-85,-130 C-115,-100 -120,-60 -105,-30 C-95,-55 -85,-75 -50,-80 Z" fill="url(#silverGrad)" />
    </g>

    <!-- CENTER HEX NUT / BOLT EMBLEM -->
    <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" fill="#f97316" stroke="#ffffff" stroke-width="6" />
    <circle cx="0" cy="0" r="18" fill="#0f172a" />

  </g>
</svg>
