<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <!-- Background: Deep Slate Dark Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="500" height="500" rx="80" fill="url(#bgGrad)"/>
  <rect x="15" y="15" width="470" height="470" rx="70" fill="none" stroke="url(#brandGrad)" stroke-width="8" stroke-opacity="0.6"/>

  <!-- Icon: Industrial Hexagon / Shield Badge -->
  <path d="M 250,110 L 370,175 L 370,305 L 250,370 L 130,305 L 130,175 Z" fill="none" stroke="url(#brandGrad)" stroke-width="16" stroke-linejoin="round"/>
  
  <!-- Inner Star Symbol -->
  <polygon points="250,170 270,225 325,225 280,260 298,315 250,280 202,315 220,260 175,225 230,225" fill="url(#brandGrad)"/>

  <!-- Brand Typography: LXMI -->
  <text x="250" y="425" text-anchor="middle" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="6">LXMI</text>
  <text x="250" y="455" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#94a3b8" letter-spacing="3">ABUZZ STORE</text>
</svg>
